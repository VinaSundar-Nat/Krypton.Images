# ==========================================
# STORAGE SETTINGS
# ==========================================
storage:
  # Directory where MongoDB stores data
  dbPath: /data/db
  
  # Storage engine (wiredTiger is default and recommended)
  engine: wiredTiger
  
  # WiredTiger specific options
  wiredTiger:
    engineConfig:
      # Cache size (50% of RAM by default, specify in GB)
      cacheSizeGB: 1
      # Directory for temporary files
      # directoryForIndexes: false
    collectionConfig:
      # Block compression (snappy is faster, zlib is smaller)
      blockCompressor: snappy
    indexConfig:
      # Prefix compression for indexes
      prefixCompression: true


# ==========================================
# SYSTEM LOG SETTINGS
# ==========================================
systemLog:
  # Log destination: file or syslog
  destination: file
  
  # Append to existing log file
  logAppend: true
  
  # Log file path
  path: /var/log/mongodb/mongod.log
  
  # Log rotation: rename or reopen
  logRotate: reopen
  
  # Verbosity level (0-5, higher = more verbose)
  verbosity: 0
  
  # Component-specific verbosity
  component:
    accessControl:
      verbosity: 0
    command:
      verbosity: 0
    query:
      verbosity: 0
    replication:
      verbosity: 0
    storage:
      verbosity: 0
    write:
      verbosity: 0


# ==========================================
# NETWORK SETTINGS
# ==========================================
net:
  # Port MongoDB listens on
  port: 27017
  
  # IP addresses to bind to (0.0.0.0 = all interfaces)
  # Use 127.0.0.1 for localhost only
  bindIp: 0.0.0.0
  
  # Maximum incoming connections
  maxIncomingConnections: 65536
  
  # Enable IPv6
  ipv6: false
  
  # SSL/TLS settings (uncomment to enable)
  # tls:
  #   mode: requireTLS
  #   certificateKeyFile: /etc/ssl/mongodb.pem
  #   CAFile: /etc/ssl/ca.pem
  
  # Compression for client-server communication
  compression:
    compressors: [snappy, zstd, zlib]


# ==========================================
# SECURITY SETTINGS
# ==========================================
security:
  # Enable authorization (require authentication)
  authorization: enabled
  
  # JavaScript execution (disable for security)
  # javascriptEnabled: true
  
  # Cluster authentication (for replica sets)
  # keyFile: /etc/mongodb/keyfile
  
  # LDAP settings (uncomment to enable)
  # ldap:
  #   servers: "ldap.example.com"
  #   bind:
  #     queryUser: "cn=admin,dc=example,dc=com"
  #     queryPassword: "password"


# ==========================================
# OPERATION PROFILING
# ==========================================
operationProfiling:
  # Profiling mode: off, slowOp, or all
  mode: slowOp
  
  # Slow operation threshold in milliseconds
  slowOpThresholdMs: 100
  
  # Sample rate for profiling (0.0 to 1.0)
  slowOpSampleRate: 1.0


# ==========================================
# REPLICATION (for replica sets)
# ==========================================
# replication:
#   # Replica set name
#   replSetName: "rs0"
#   
#   # Oplog size in MB
#   oplogSizeMB: 1024
#   
#   # Enable majority read concern
#   enableMajorityReadConcern: true


# ==========================================
# SHARDING (for sharded clusters)
# ==========================================
# sharding:
#   # Role: configsvr or shardsvr
#   clusterRole: shardsvr
#   
#   # Config server connection string
#   # configDB: "configReplSet/cfg1.example.com:27019,cfg2.example.com:27019"


# ==========================================
# PROCESS MANAGEMENT
# ==========================================
processManagement:
  # Timezone data directory
  timeZoneInfo: /usr/share/zoneinfo
  
  # Fork process to background (not needed in Docker)
  # fork: false
  
  # PID file path
  # pidFilePath: /var/run/mongodb/mongod.pid


# ==========================================
# SET PARAMETERS (advanced settings)
# ==========================================
setParameter:
  # Enable detailed diagnostic data collection
  diagnosticDataCollectionEnabled: true
  
  # Limit on concurrent operations
  # maxNumActiveUserIndexBuilds: 3
  
  # Connection pool settings
  # connPoolMaxShardedConnsPerHost: 200
  # connPoolMaxConnsPerHost: 200
  
  # Query settings
  # internalQueryExecMaxBlockingSortBytes: 33554432
  
  # Disable transparent huge pages warning
  # suppressNoTLSPeerCertificateWarning: true


# ==========================================
# AUDIT LOG (Enterprise only)
# ==========================================
# auditLog:
#   destination: file
#   format: JSON
#   path: /var/log/mongodb/audit.json
#   filter: '{ atype: { $in: [ "authenticate", "authCheck" ] } }'