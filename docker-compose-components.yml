version: '3.5'

services:
    redis:
      container_name: kr_redis
      image: kr_cache_redis:${RUNTIME_VERSION}
      labels:
        com.acc.cache.description: "KR cache store - redis"
      restart: always     
      build:
        context: .
        dockerfile: .docker/redis.dockerfile
      ports:
        - "6379:6379"
      networks:
        kr_network: 
          ipv4_address: 192.168.10.2

    mongo:
      container_name: kr_mongo
      image: kr_database_mongo:${RUNTIME_VERSION}
      labels:
        com.acc.database.description: "KR database - mongo"
      restart: always
      build:
        context: .
        dockerfile: .docker/mongo.dockerfile
      env_file:
        - .docker/.env/mongo.prod.env
      ports:
        - "27017:27017"
      networks:
        kr_network:
          ipv4_address: 192.168.10.14
